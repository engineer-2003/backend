# 기존 설정
spring.application.name=japanese-haru

spring.datasource.url=jdbc:mysql://localhost:3306/japanese_haru?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT 설정
jwt.secret-key=${JWT_SECRET_KEY}
jwt.token-validity-in-seconds=3600 


# Gmail SMTP 설정
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=japaneseharu0808@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# Google OAuth2 설정 
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}

spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Google AI Studio (https://aistudio.google.com/)에서 발급받은 API 키
spring.config.import=optional:file:.env[.properties]
google.api.key=${GOOGLE_API_KEY}